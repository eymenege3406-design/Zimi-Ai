<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIMI AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #3b82f6; }
        header h1 { color: #60a5fa; font-size: 24px; letter-spacing: 1px; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .user-message { align-self: flex-end; background-color: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background-color: #334155; color: #f1f5f9; border: 1px solid #475569; border-bottom-left-radius: 2px; }
        .input-container { padding: 15px; background-color: #1e293b; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; outline: none; font-size: 15px; }
        button { padding: 12px 20px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <header><h1>⚡ ZIMI AI ⚡</h1></header>
    <div id="chat-box">
        <div class="message ai-message">Merhaba! Ben ZIMI AI. Nasıl yardımcı olabilirim?</div>
    </div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="ZIMI AI'ya yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const msg = input.value.trim();
            if (!msg) return;

            appendMsg(msg, 'user-message');
            input.value = '';

            const loading = document.createElement('div');
            loading.className = 'message ai-message';
            loading.innerText = 'ZIMI AI yazıyor...';
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: 'Senin adın ZIMI AI. Türkçe konuşan, oyunculara yardımcı olan akıllı bir yapay zekasın.' },
                            { role: 'user', content: msg }
                        ],
                        model: 'openai'
                    })
                });
                const text = await res.text();
                chatBox.removeChild(loading);
                appendMsg(text, 'ai-message');
            } catch (e) {
                chatBox.removeChild(loading);
                appendMsg('Hata oluştu, tekrar dene!', 'ai-message');
            }
        }
        function appendMsg(text, className) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
